<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Login - Petulap SST</title>
  
  <link rel="stylesheet" href="css/tokens.css?v=1">
    <link rel="stylesheet" href="css/styles.css?v=3">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#F4F7FE">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Petulap SST">
  
  <script>
    if ("serviceWorker" in navigator) { 
      window.addEventListener("load", () => { 
        navigator.serviceWorker.register("sw.js").then(r => console.log("SW ok")).catch(e => console.log("SW fail", e)); 
      }); 
    }
  </script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <!-- Dashboard Styles -->
    <link rel="stylesheet" href="css/dashboard.css?v=3">
    <style>
      body {
          display: flex;
          align-items: center;
          justify-content: center;
          min-height: 100vh;
          background-color: var(--bg-body);
          margin: 0;
          font-family: 'Inter', sans-serif;
      }
      .login-container {
          width: 100%;
          max-width: 400px;
          padding: 20px;
      }
      .login-card {
          background: var(--bg-card);
          padding: 40px 30px;
          border-radius: var(--border-radius);
          box-shadow: var(--card-shadow);
          text-align: center;
      }
      .login-logo {
          font-size: 48px;
          margin-bottom: 10px;
      }
      .login-card h2 {
          color: var(--dark-text);
          font-size: 24px;
          font-weight: 700;
          margin-bottom: 5px;
          margin-top: 0;
      }
      .login-subtitle {
          color: var(--gray-text);
          font-size: 14px;
          margin-bottom: 30px;
      }
      .form-group {
          margin-bottom: 20px;
          text-align: left;
      }
      .form-label {
          display: block;
          font-size: 13px;
          font-weight: 600;
          color: var(--dark-text);
          margin-bottom: 8px;
      }
      .form-control {
          width: 100%;
          padding: 12px 16px;
          border: 1px solid var(--border-color);
          border-radius: 8px;
          font-size: 14px;
          font-family: 'Inter', sans-serif;
          transition: var(--transition);
          box-sizing: border-box;
      }
      .form-control:focus {
          outline: none;
          border-color: var(--primary);
          box-shadow: 0 0 0 3px var(--primary-light);
      }
      .btn-primary {
          width: 100%;
          padding: 14px;
          background-color: var(--primary);
          color: white;
          border: none;
          border-radius: 8px;
          font-size: 15px;
          font-weight: 600;
          cursor: pointer;
          transition: var(--transition);
          margin-top: 10px;
      }
      .btn-primary:hover {
          background-color: var(--primary-hover);
      }
      .public-link {
          display: block;
          margin-top: 25px;
          color: var(--primary);
          font-size: 13px;
          font-weight: 500;
          text-decoration: none;
      }
      .error-msg {
          color: var(--danger);
          background-color: var(--danger-light);
          padding: 12px;
          border-radius: 8px;
          font-size: 13px;
          font-weight: 500;
          margin-top: 20px;
          display: none;
      }
    </style>

    <script>
      (function(){
        if(localStorage.getItem('petulap-theme') === 'dark') {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
</head>
<body>
  <button class="theme-toggle-btn" aria-label="Cambiar tema" onclick="toggleTheme()" style="position:absolute; top:20px; right:20px; background:none; border:none; font-size:24px; cursor:pointer; color:var(--text-secondary);">
    <i class="ph ph-moon"></i>
  </button>

  <div class="login-container">
    <div class="card login-card">
      <div class="login-logo">🔒</div>
      <h2>Petulap SST</h2>
      <p class="login-subtitle">Acceso Seguro al Sistema</p>

      <div class="form-group">
        <label class="form-label">DNI / Usuario</label>
        <input type="text" id="f-dni" class="form-control" placeholder="Ej: ADMIN001" autofocus onkeydown="if(event.key==='Enter') document.getElementById('f-pass').focus()">
      </div>
      
      <div class="form-group">
        <label class="form-label">Contrasena</label>
        <input type="password" id="f-pass" class="form-control" placeholder="••••••••" onkeydown="if(event.key==='Enter') intentarLogin()">
      </div>

      <button class="btn btn-primary" onclick="intentarLogin()" id="btn-submit">Ingresar al Sistema</button>
      
      <div class="error-msg" id="error-msg"></div>

      <a href="consulta.html" class="public-link">Eres cliente? Rastrear equipo aqui</a>
    </div>
  </div>

  <script src="js/sonidos.js"></script>
  <script src="js/push.js"></script>
  <script src="js/check_auth.js"></script>
  <script>
    async function intentarLogin() {
      const dni = document.getElementById('f-dni').value.trim();
      const pass = document.getElementById('f-pass').value.trim();
      const errorDiv = document.getElementById('error-msg');
      const btn = document.getElementById('btn-submit');

      if (!dni || !pass) {
        errorDiv.textContent = "Ingresa DNI y contrasena";
        errorDiv.style.display = "block";
        if(typeof playSound === 'function') playSound('error');
        return;
      }

      btn.disabled = true;
      btn.innerHTML = "⏳ Validando...";
      errorDiv.style.display = "none";

      try {
        const res = await fetch('api/auth.php?action=login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ dni: dni, password: pass })
        }).then(r => r.json());

        if (res.ok) {
          if(typeof playSound === 'function') playSound('success');
          localStorage.setItem('tecnico_id', res.data.id);
          localStorage.setItem('tecnico_nombre', res.data.nombre);
          localStorage.setItem('tecnico_tipo', res.data.tipo);
          
          // Subscribe to push notifications (non-blocking)
          try { await petulap_subscribePush(); } catch(e) { console.log('Push setup skipped:', e); }
          
          window.location.href = res.data.start_url || 'index.html';
        } else {
          throw new Error(res.msg || "Credenciales invalidas");
        }
      } catch (err) {
        errorDiv.innerHTML = '<i class="ph ph-x"></i> ' + err.message;
        errorDiv.style.display = "block";
        if(typeof playSound === 'function') playSound('error');
        btn.disabled = false;
        btn.innerHTML = "Ingresar al Sistema";
      }
    }
  </script>

</body>
</html>
